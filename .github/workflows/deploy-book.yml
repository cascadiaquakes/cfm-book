name: deploy-book

# Run this when main changes
on:
  push:
    branches:
    - main

# This job installs dependencies, builds the book, and pushes it to GitHub Pages
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: cache executed notebooks
      uses: actions/cache@v4
      with:
        path: _build/.jupyter_cache
        key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

    # BASE_URL tells MyST to prefix asset/link paths with the repository
    # name; GitHub Pages serves this repo at cascadiaquakes.github.io/cfm-book/
    # so without the prefix the site 404s its own assets.
    - name: Build the book
      env:
        BASE_URL: /cfm-book
      run: |
        jupyter book build --html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: "_build/html"

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
